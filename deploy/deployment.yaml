# Runs the agent as an on-demand Job-style pod. Interactive HIL: kubectl exec -it, or APPROVER=file + `k8s-agent approve`.
apiVersion: apps/v1
kind: Deployment
metadata: {name: k8s-agent, namespace: k8s-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: k8s-agent}}
  template:
    metadata: {labels: {app: k8s-agent}}
    spec:
      serviceAccountName: k8s-agent
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: <ECR_REPO>/ai-agent-k8s:0.1.0
          command: ["sleep", "infinity"]
          envFrom: [{secretRef: {name: k8s-agent-env}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: scratch, mountPath: /tmp}, {name: state, mountPath: /state}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
      volumes: [{name: scratch, emptyDir: {}}, {name: state, emptyDir: {}}]
---
# Egress only to DNS, the K8s API and AWS endpoints (tighten with VPC endpoints for Bedrock).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: k8s-agent-egress, namespace: k8s-agent}
spec:
  podSelector: {matchLabels: {app: k8s-agent}}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
